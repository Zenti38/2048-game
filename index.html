<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      href="./ChatGPT Image 19 июл. 2026 г., 19_04_35.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./reset.css" />
    <title>Game</title>
  </head>
  <body>
    <section class="2048">
      <div class="info">
        <h1 class="info-h1">2048</h1>
        <div class="info-buttons">
          <button class="info-button-clear info-button">очистити</button>
          <button class="info-button-play info-button">грати</button>
          <button class="info-button-auto info-button">автоматично</button>
        </div>
      </div>
      <div class="game">
        <div class="game-box1 game-box"></div>
        <div class="game-box2 game-box"></div>
        <div class="game-box3 game-box"></div>
        <div class="game-box4 game-box"></div>
        <div class="game-box5 game-box"></div>
        <div class="game-box6 game-box"></div>
        <div class="game-box7 game-box"></div>
        <div class="game-box8 game-box"></div>
        <div class="game-box9 game-box"></div>
        <div class="game-box10 game-box"></div>
        <div class="game-box11 game-box"></div>
        <div class="game-box12 game-box"></div>
        <div class="game-box13 game-box"></div>
        <div class="game-box14 game-box"></div>
        <div class="game-box15 game-box"></div>
        <div class="game-box16 game-box"></div>
      </div>
      <div class="help">
        <p class="help-p-bigger">Як грати:</p>
        <p class="help-p-smaller">
          Використовуйте клавіші зі стрілками ← ↑ → ↓, щоб рухати числа, або
          натисніть «Авто гра», щоб побачити, як грає комп’ютер! Коли два
          однакові числа торкаються, вони об’єднуються в одне!
        </p>
      </div>
    </section>
    <script src="./main.js"></script>
  </body>
</html>
